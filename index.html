const fmtUSD = (n, ticker) => {
  const decimals = ticker === "BTC" ? 0 : 2;
  return "$" + Number(n).toLocaleString(undefined, { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
};
const fmtSigned = (n, ticker) => (n >= 0 ? "+" : "") + fmtUSD(n, ticker);
const fmtPct = (n) => (n >= 0 ? "+" : "") + n.toFixed(2) + "%";

function CandlestickProgress({ completed, total }) {
  // Signature visual: the learning path rendered as a strip of candlesticks.
  const candles = Array.from({ length: total }, (_, i) => {
    const day = i + 1;
    const isDone = completed.includes(day);
    const isNext = !isDone && day === Math.min(...LESSONS.map(l => l.id).filter(id => !completed.includes(id)), total + 1);
    return { day, isDone, isNext };
  });
  return (
    <div className="flex items-end gap-[3px] h-16 mt-3">
      {candles.map((c) => {
        const bodyH = c.isDone ? 26 + (c.day % 4) * 6 : 14;
        const wickH = bodyH + 10;
        const color = c.isDone ? C.gain : c.isNext ? C.amber : C.textFaint;
        const bg = c.isDone ? C.gain : c.isNext ? C.amber : "transparent";
        return (
          <div key={c.day} className="flex flex-col items-center justify-end" style={{ width: `${100 / total}%`, height: "100%" }}>
            <div style={{ width: 1.5, height: wickH - bodyH, background: color, opacity: c.isDone || c.isNext ? 0.9 : 0.35 }} />
            <div style={{ width: "70%", height: bodyH, background: bg, border: `1.3px solid ${color}`, opacity: c.isDone || c.isNext ? 1 : 0.35, borderRadius: 1 }} />
          </div>
        );
      })}
    </div>
  );
}

function Sparkline({ data, color, width = 280, height = 64 }) {
  if (!data || data.length < 2) return <div style={{ height }} />;
  const min = Math.min(...data);
  const max = Math.max(...data);
  const range = max - min || 1;
  const pts = data.map((v, i) => {
    const x = (i / (data.length - 1)) * width;
    const y = height - ((v - min) / range) * height;
    return `${x},${y}`;
  }).join(" ");
  const areaPts = `0,${height} ${pts} ${width},${height}`;
  const gradId = "grad-" + color.replace("#", "");
  return (
    <svg width="100%" viewBox={`0 0 ${width} ${height}`} preserveAspectRatio="none" style={{ display: "block" }}>
      <defs>
        <linearGradient id={gradId} x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={color} stopOpacity="0.35" />
          <stop offset="100%" stopColor={color} stopOpacity="0" />
        </linearGradient>
      </defs>
      <polygon points={areaPts} fill={`url(#${gradId})`} />
      <polyline points={pts} fill="none" stroke={color} strokeWidth="2" strokeLinejoin="round" strokeLinecap="round" />
    </svg>
  );
}

function QuizBlock({ quiz, onAnswered, savedResult }) {
  const [selected, setSelected] = useState(savedResult ? savedResult.selected : null);
  const answered = selected !== null;
  const isCorrect = selected === quiz.correct;

  return (
    <div className="rounded-2xl p-4 mt-4" style={{ background: C.surfaceAlt, border: `1px solid ${C.border}` }}>
      <div className="flex items-center gap-2 mb-3">
        <Brain size={16} color={C.amber} />
        <span style={{ fontFamily: fontMono, fontSize: 11, letterSpacing: "0.08em", color: C.amber, textTransform: "uppercase" }}>Quiz check</span>
      </div>
      <p style={{ color: C.text, fontSize: 15, fontWeight: 600, marginBottom: 12 }}>{quiz.q}</p>
      <div className="flex flex-col gap-2">
        {quiz.options.map((opt, i) => {
          let border = C.border, bg = "transparent", txt = C.text;
          if (answered) {
            if (i === quiz.correct) { border = C.gain; bg = C.gainDim; txt = C.gain; }
            else if (i === selected) { border = C.loss; bg = C.lossDim; txt = C.loss; }
          }
          return (
            <button
              key={i}
              disabled={answered}
              onClick={() => { setSelected(i); onAnswered && onAnswered(i === quiz.correct, i); }}
              className="text-left rounded-xl px-3 py-2.5 flex items-center justify-between"
              style={{ border: `1px solid ${border}`, background: bg, color: txt, fontSize: 13.5 }}
            >
              <span>{opt}</span>
              {answered && i === quiz.correct && <Check size={15} color={C.gain} />}
              {answered && i === selected && i !== quiz.correct && <X size={15} color={C.loss} />}
            </button>
          );
        })}
      </div>
      {answered && (
        <div className="mt-3 flex gap-2 rounded-xl p-3" style={{ background: C.surface }}>
          <Info size={14} color={C.info} style={{ marginTop: 2, flexShrink: 0 }} />
          <p style={{ color: C.textMuted, fontSize: 12.5, lineHeight: 1.5 }}>{quiz.explain}</p>
        </div>
      )}
    </div>
  );
}

  const [screen, setScreen] = useState("home");

  const [quizResults, setQuizResults] = useState({}); // lessonId -> {selected, correct}

  // Paper trading state
  const [prices, setPrices] = useState(() => Object.fromEntries(TICKERS.map(t => [t.ticker, t.base])));
  const [history, setHistory] = useState(() => Object.fromEntries(TICKERS.map(t => [t.ticker, [t.base]])));
  const [balance, setBalance] = useState(10000);
  const [positions, setPositions] = useState([]);
  const [closedTrades, setClosedTrades] = useState([]);
  const [selectedTicker, setSelectedTicker] = useState("AAPL");
  const [tradeForm, setTradeForm] = useState({ qty: "", stopLoss: "", takeProfit: "" });
  const [tradeError, setTradeError] = useState("");
  const [pendingJournalTradeId, setPendingJournalTradeId] = useState(null);

  // Journal
  const [journalEntries, setJournalEntries] = useState([]);
  const [showJournalForm, setShowJournalForm] = useState(false);
  const [draft, setDraft] = useState({ why: "", stop: "", target: "", whatHappened: "", whatLearned: "" });

  const positionsRef = useRef(positions);
  useEffect(() => { positionsRef.current = positions; }, [positions]);

  // Live-simulated price feed
  useEffect(() => {
    const iv = setInterval(() => {
      setPrices(prev => {
        const next = {};
        TICKERS.forEach(t => {
          const last = prev[t.ticker];
          const vol = t.ticker === "BTC" ? 0.006 : 0.004;
          const change = last * (Math.random() * vol * 2 - vol);
          next[t.ticker] = Math.max(0.01, last + change);
        });

        // auto-check stop-loss / take-profit
        const stillOpen = [];
        const toClose = [];
        positionsRef.current.forEach(p => {
          const px = next[p.ticker];
          if (p.stopLoss && px <= p.stopLoss) toClose.push({ ...p, exitPrice: p.stopLoss, reason: "Stop-loss hit" });
          else if (p.takeProfit && px >= p.takeProfit) toClose.push({ ...p, exitPrice: p.takeProfit, reason: "Take-profit hit" });
          else stillOpen.push(p);
        });
        if (toClose.length) {
          setPositions(stillOpen);
          setBalance(b => b + toClose.reduce((sum, p) => sum + p.qty * p.exitPrice, 0));
          setClosedTrades(ct => [
            ...toClose.map(p => ({ ...p, pnl: (p.exitPrice - p.entryPrice) * p.qty, closedAt: new Date() })),
            ...ct,
          ]);
          setPendingJournalTradeId(toClose[0].id);
        }

        setHistory(h => {
          const nh = {};
          TICKERS.forEach(t => { nh[t.ticker] = [...h[t.ticker], next[t.ticker]].slice(-40); });
          return nh;
        });

        return next;
      });
    }, 2000);
    return () => clearInterval(iv);
  }, []);

  const totalModules = LESSONS.length;

  function openTrade() {
    setTradeError("");
    const qty = Number(tradeForm.qty);
    const price = prices[selectedTicker];
    if (!qty || qty <= 0) { setTradeError("Enter a position size greater than 0."); return; }
    const cost = qty * price;
    if (cost > balance) { setTradeError("That exceeds your available buying power."); return; }
    const sl = tradeForm.stopLoss ? Number(tradeForm.stopLoss) : null;
    const tp = tradeForm.takeProfit ? Number(tradeForm.takeProfit) : null;
    if (sl && sl >= price) { setTradeError("Stop-loss should be below your entry price for a long position."); return; }
    if (tp && tp <= price) { setTradeError("Take-profit should be above your entry price for a long position."); return; }

    const position = {
      id: uid(), ticker: selectedTicker, entryPrice: price, qty,
      stopLoss: sl, takeProfit: tp, openedAt: new Date(),
    };
    setPositions(p => [position, ...p]);
    setBalance(b => b - cost);
    setTradeForm({ qty: "", stopLoss: "", takeProfit: "" });
  }

  function closePositionManually(id) {
    const pos = positions.find(p => p.id === id);
    if (!pos) return;
    const exitPrice = prices[pos.ticker];
    const proceeds = pos.qty * exitPrice;
    const pnl = (exitPrice - pos.entryPrice) * pos.qty;
    setPositions(prev => prev.filter(p => p.id !== id));
    setBalance(b => b + proceeds);
    setClosedTrades(ct => [{ ...pos, exitPrice, pnl, closedAt: new Date(), reason: "Closed manually" }, ...ct]);
    setPendingJournalTradeId(id);
  }

  function saveJournalEntry() {
    if (!draft.why.trim() && !draft.whatHappened.trim()) return;

      date: new Date(),
      tradeId: pendingJournalTradeId,
      ...draft,

  const avgWin = wins ? closedTrades.filter(t => t.pnl > 0).reduce((s, t) => s + t.pnl, 0) / wins : 0;
  const lossesCount = closedTrades.length - wins;
  const avgLoss = lossesCount ? Math.abs(closedTrades.filter(t => t.pnl <= 0).reduce((s, t) => s + t.pnl, 0) / lossesCount) : 0;
  const rr = avgLoss ? (avgWin / avgLoss).toFixed(2) : "—";

              </div>
              <div className="flex gap-2.5 mt-4">
                <button onClick={() => { setShowJournalForm(false); setPendingJournalTradeId(null); }} className="flex-1 rounded-lg py-2.5" style={{ border: `1px solid ${C.border}`, color: C.textMuted, fontSize: 13 }}>Cancel</button>
                <button onClick={saveJournalEntry} className="flex-1 rounded-lg py-2.5" style={{ background: C.amber, color: "#1A1204", fontWeight: 700, fontSize: 13 }}>Save entry</button>
              </div>
            </div>
          )}

          {journalEntries.length === 0 && !showJournalForm && (
            <div className="text-center py-10">
              <PenLine size={26} color={C.textFaint} style={{ margin: "0 auto" }} />
              <p style={{ color: C.textFaint, fontSize: 13, marginTop: 10 }}>No entries yet. Log your first trade to start building a record you can actually learn from.</p>
            </div>
          )}

          <div className="flex flex-col gap-3">
            {journalEntries.map(e => {
              const trade = closedTrades.find(t => t.id === e.tradeId);
              return (
                <div key={e.id} className="rounded-2xl p-4" style={{ background: C.surface, border: `1px solid ${C.border}` }}>
                  <div className="flex items-center justify-between mb-2">
                    <span style={{ color: C.textFaint, fontSize: 10.5 }}>{new Date(e.date).toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" })}</span>
                    {trade && <span style={{ fontFamily: fontMono, fontSize: 11.5, color: trade.pnl >= 0 ? C.gain : C.loss }}>{trade.ticker} · {fmtSigned(trade.pnl)}</span>}
                  </div>
                  {e.why && <JournalRow label="Why I entered" text={e.why} />}
                  {(e.stop || e.target) && (
                    <div className="flex gap-4 mt-1.5">
                      {e.stop && <span style={{ fontSize: 11.5, color: C.loss }}>Stop: {e.stop}</span>}
                      {e.target && <span style={{ fontSize: 11.5, color: C.gain }}>Target: {e.target}</span>}
                    </div>
                  )}
                  {e.whatHappened && <JournalRow label="What happened" text={e.whatHappened} />}
                  {e.whatLearned && <JournalRow label="What I learned" text={e.whatLearned} />}
                </div>
              );
            })}
          </div>
        </div>
      </div>
    );
  }

  function JournalField({ label, value, onChange, tall }) {
    return (
      <label className="flex-1 flex flex-col gap-1">
        <span style={{ color: C.textFaint, fontSize: 10.5 }}>{label}</span>
        {tall ? (
          <textarea rows={2} value={value} onChange={e => onChange(e.target.value)} className="rounded-lg px-3 py-2.5" style={{ background: C.surfaceAlt, border: `1px solid ${C.border}`, color: C.text, fontSize: 13, outline: "none", resize: "none" }} />
        ) : (
          <input value={value} onChange={e => onChange(e.target.value)} className="rounded-lg px-3 py-2.5" style={{ background: C.surfaceAlt, border: `1px solid ${C.border}`, color: C.text, fontSize: 13, outline: "none" }} />
        )}
      </label>
    );
  }

  function JournalRow({ label, text }) {
    return (
      <div className="mt-1.5">
        <span style={{ color: C.textFaint, fontSize: 10.5 }}>{label}: </span>
        <span style={{ color: C.text, fontSize: 12.5 }}>{text}</span>
      </div>
    );
  }

  let body;
  if (screen === "home") body = <HomeScreen />;
  else if (screen === "learn") body = <LearnScreen />;
  else if (screen === "lessonDetail") body = <LessonDetailScreen />;
  else if (screen === "quizzes") body = <QuizzesScreen />;
  else if (screen === "trade") body = <TradeScreen />;
  else if (screen === "journal") body = <JournalScreen />;

  return (
    <div className="flex flex-col mx-auto" style={{ maxWidth: 430, height: "100vh", background: C.bg, fontFamily: fontBody }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
      `}</style>
      {body}
      <BottomNav screen={screen} setScreen={(s) => { setScreen(s); setPendingJournalTradeId(pj => screen === "journal" ? pj : pj); }} />
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<TradeLabApp />);
</script>
</body>
</html>
