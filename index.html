10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline>'),Ye=h('<circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line>'),e={bg:"#0F131A",surface:"#1A202B",surfaceAlt:"#212938",border:"#2B3444",text:"#EDEFF3",textMuted:"#8993A6",textFaint:"#5B6478",amber:"#E3A23C",amberDim:"#4A3A21",gain:"#4FAE8A",gainDim:"#1E332C",loss:"#E2664B",lossDim:"#3A241F",info:"#6C93C7"},ie="'Space Grotesk', system-ui, sans-serif",_e="'Inter', system-ui, sans-serif",g="'IBM Plex Mono', 'Courier New', monospace",M=[{ticker:"RY.TO",name:"Royal Bank of Canada",base:145.2},{ticker:"SHOP.TO",name:"Shopify Inc.",base:98.5},{ticker:"AAPL",name:"Apple Inc.",base:227.3},{ticker:"BTC",name:"Bitcoin",base:64e3}],v=[{id:1,title:"Market Basics",subtitle:"What you're actually trading",content:[`A market is just a venue where buyers and sellers agree on a price. When you place a trade, you're not "beating the market" \u2014 you're taking the other side of someone else's decision.`,"Stocks represent ownership in a company. ETFs bundle many holdings into one trade. Bitcoin and other crypto assets trade 24/7 with no central exchange.","Price moves because of shifting supply and demand \u2014 driven by earnings, news, interest rates, and plain old sentiment. No indicator predicts it with certainty; you're always trading probabilities."],quiz:{q:"Why does a stock's price move?",options:["A committee sets it every morning","Shifting supply and demand among buyers and sellers","It only moves when the company issues news","It's fixed by the exchange"],correct:1,explain:"Price is the constantly-updating result of buyers and sellers disagreeing on value."}},{id:2,title:"Candlesticks",subtitle:"Reading price action at a glance",content:['Each candlestick shows four numbers for a time period: open, high, low, and close. The "body" is the range between open and close; the "wicks" show the high/low extremes.',"A green (or hollow) candle closed higher than it opened \u2014 buyers were in control. A red (or filled) candle closed lower \u2014 sellers won that period.","Long wicks tell a story: a long lower wick means sellers pushed price down but buyers stepped in and rejected it. That single shape carries more information than a line chart ever will."],quiz:{q:"A candle with a long lower wick and a small body near the top suggests:",options:["Sellers pushed price down, but buyers rejected the move","The stock is halted","Nothing \u2014 wicks are random noise","The company reported bad earnings"],correct:0,explain:"Long lower wicks show rejection of lower prices \u2014 often a sign buyers stepped back in."}},{id:3,title:"Trends & Market Structure",subtitle:"Higher highs, lower lows",content:["An uptrend is a series of higher highs and higher lows. A downtrend is the mirror image. Sideways markets chop between a range with no clear directional edge.","Market structure breaks \u2014 when a prior swing high or low gets taken out \u2014 are often the earliest clue that a trend is shifting before news catches up.","Trading with the dominant trend gives you a statistical tailwind. Fighting it can still work occasionally, but the odds are stacked against you."],quiz:{q:"What defines an uptrend?",options:["Rising volume only","A series of higher highs and higher lows","Green candles every day","Price above the 200-day average"],correct:1,explain:"Structure \u2014 not color or volume alone \u2014 is what technically defines a trend."}},{id:4,title:"Support & Resistance",subtitle:"The floors and ceilings of price",content:["Support is a price zone where buying pressure has historically stepped in. Resistance is where selling pressure has capped price. Neither is an exact line \u2014 think zones, not laser beams.","The more times a level is tested, the more traders watch it \u2014 which can become a self-fulfilling reaction, but also means a break is often more violent once it happens.",'Old resistance frequently becomes new support once broken, and vice versa. This "role reversal" is one of the most reliable structural patterns.'],quiz:{q:"What often happens after a strong resistance level finally breaks?",options:["It's never touched again","It can flip into support on a retest","Volume disappears","The trend always reverses immediately"],correct:1,explain:"Role reversal \u2014 broken resistance acting as new support \u2014 is a well-documented structural pattern."}},{id:5,title:"Volume",subtitle:"The fuel behind the move",content:["Volume measures how many shares or contracts changed hands. It's the fuel gauge for a price move \u2014 a breakout on heavy volume is far more credible than one on thin volume.","Rising price on falling volume can be a warning sign: fewer participants are willing to pay up, and the move may be running out of conviction.","Volume spikes around news, earnings, or session opens/closes are normal. Context matters more than the raw number."],quiz:{q:"A breakout above resistance on very low volume is generally:",options:["More reliable than a high-volume breakout","Less reliable \u2014 it may lack conviction","Impossible to interpret","A guaranteed reversal signal"],correct:1,explain:"Low participation behind a move is a classic reason breakouts fail."}},{id:6,title:"Entries & Exits",subtitle:"Timing is a plan, not a feeling",content:["A good entry isn't about being early or clever \u2014 it's about entering at a point where your thesis is confirmed and your risk is clearly defined.","Plan your exit before you enter. Decide your target (take-profit) and your invalidation point (stop-loss) as part of the same decision, not as an afterthought once you're already in the trade.","Scaling in or out \u2014 taking partial size at different levels \u2014 can smooth results, but only once you're comfortable with single, full-size entries and exits."],quiz:{q:"When should your exit plan be decided?",options:["After the trade starts moving against you","Before you enter the trade","Only if the trade is profitable","Exits don't need planning"],correct:1,explain:"Planning entries and exits together removes emotion from the moment you most need clarity."}},{id:7,title:"Stop-Loss & Risk Management",subtitle:"The only thing you fully control",content:["A stop-loss is a predetermined price where you accept you were wrong and exit. It's not a failure \u2014 it's the cost of participating in an uncertain market.","A common guideline is risking no more than 1\u20132% of total account value on any single trade. That keeps a string of losses from doing lasting damage.",`Never move a stop-loss further away once you're in a losing trade to "give it room." That's the single most common way small losses become account-ending ones.`],quiz:{q:"A widely used risk guideline is to risk no more than:",options:["10\u201320% of your account per trade","1\u20132% of your account per trade","50% of your account per trade","Risk doesn't need to be sized"],correct:1,explain:"Small, consistent risk per trade is what lets you survive a losing streak."}},{id:8,title:"Position Sizing",subtitle:"How much, not just when",content:["Position size = (account risk in dollars) \xF7 (distance from entry to stop-loss). This single formula ties your risk rule directly to how many shares or contracts you buy.","Two traders can take the identical entry and stop and end up with wildly different outcomes purely because of size. Sizing is often more important than the entry itself.","Bigger isn't better. Oversized positions turn small, normal price wiggles into gut-wrenching decisions made from fear rather than plan."],quiz:{q:"If you risk $100 and your stop is $2 away from entry, how many shares should you buy?",options:["200 shares","50 shares","2 shares","100 shares"],correct:1,explain:"$100 risk \xF7 $2 per share = 50 shares \u2014 exactly your defined risk if the stop is hit."}},{id:9,title:"Trading Psychology",subtitle:"Your biggest edge or your biggest leak",content:["Fear and greed distort decisions in predictable ways: cutting winners too early, letting losers run too long, and revenge-trading after a loss.","A trading plan only works if you follow it when it's uncomfortable. Discipline under stress \u2014 not cleverness \u2014 separates consistent traders from the rest.",'Tilt is real: after a loss, the urge to "win it back immediately" is one of the most reliable ways to compound a small loss into a large one. Recognizing the feeling is the first defense.'],quiz:{q:'"Revenge trading" refers to:',options:["A disciplined re-entry after analysis","Trying to immediately win back a loss, often oversized and impulsive","Trading a competitor's strategy","A type of stop-loss order"],correct:1,explain:"Revenge trading is emotional, not analytical \u2014 and it's one of the fastest ways to blow up an account."}},{id:10,title:"Building Your First Strategy",subtitle:"Turning rules into a repeatable system",content:["A strategy needs explicit rules for all four pillars: what you trade, when you enter, where your stop and target sit, and how big your position is.","Write it down. If you can't explain your strategy in a few plain sentences, it's not a strategy yet \u2014 it's a hunch with extra steps.","Backtest or paper-trade the rules before risking real money. The goal at this stage isn't profit \u2014 it's proving the process is consistent."],quiz:{q:"What are the four pillars a trading strategy needs rules for?",options:["News, luck, timing, and confidence","What to trade, entry, stop/target, and position size","Only entry and exit","Just the ticker symbol"],correct:1,explain:"A complete strategy defines the instrument, the entry trigger, risk levels, and sizing \u2014 nothing left to feel."}},{id:11,title:"Paper Trading",subtitle:"Proving it before you risk it",content:["Paper trading lets you execute your strategy with simulated money, so mistakes cost lessons instead of dollars.","Treat it seriously \u2014 size positions and set stops exactly as you would with real capital. Sloppy paper trading builds sloppy real habits.","Use the paper trading tab in this app to place trades, watch them play out against live-simulated prices, and see your stop-loss and take-profit auto-execute."],quiz:{q:"The main value of paper trading is:",options:["Guaranteed future profits","Practicing execution and discipline without financial risk","It's required by regulators","It removes the need for a strategy"],correct:1,explain:"Paper trading builds the muscle memory of following a plan \u2014 without the cost of being wrong."}},{id:12,title:"Reviewing Your Performance",subtitle:"The step most traders skip",content:["Win rate alone means little without risk/reward. A trader who wins 40% of the time but makes 3x on winners can be far more profitable than one who wins 70% of the time for small gains.","A trading journal turns scattered trades into a dataset. Reviewing it reveals patterns you'd never notice trade-by-trade \u2014 like a tendency to cut winners early on Mondays.","Review weekly, not just after big losses. The goal is to refine the process, not to relive every emotional high or low."],quiz:{q:"Why can a 40% win rate still be profitable?",options:["It can't be","If average winners are large enough relative to average losers","Win rate is the only metric that matters","Because of luck alone"],correct:1,explain:"Expectancy = (win% \xD7 avg win) \u2212 (loss% \xD7 avg loss). Risk/reward can outweigh win rate."}}],S=(i,l)=>{let y=l==="BTC"?0:2;return"$"+Number(i).toLocaleString(void 0,{minimumFractionDigits:y,maximumFractionDigits:y})},W=(i,l)=>(i>=0?"+":"")+S(i,l),ge=i=>(i>=0?"+":"")+i.toFixed(2)+"%",he=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);function H({title:i,onBack:l}){return React.createElement("div",{className:"flex items-center gap-3 px-5 pt-6 pb-4",style:{background:e.bg}},l&&React.createElement("button",{onClick:l,className:"p-1 -ml-1 rounded-fu
